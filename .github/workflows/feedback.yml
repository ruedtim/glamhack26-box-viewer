# Feedback from the results site: every 10 minutes, fetch the messages the feedback relay (feedback-relay/Code.gs, a
# Google Apps Script web app) has received from the «Feedback» form, and open one issue each. Uses GitHub's own token
# for this run (issues: write); no personal token is stored anywhere. Run it by hand under Actions → Run workflow.
name: Feedback from the results site
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: feedback-relay
  cancel-in-progress: false
jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for each new message
        uses: actions/github-script@v7
        env:
          RELAY_URL: https://script.google.com/macros/s/AKfycbwq5h4eYLosUKT5GRU-6PGGK5sowW_voGYxxn3DRq9g4Ngua-r4scgbuTz5NuladMGS5g/exec
        with:
          script: |
            const relay = process.env.RELAY_URL;
            const res = await fetch(relay + '?pending=1');
            if (!res.ok) throw new Error(`The relay answered ${res.status}`);
            const { items = [] } = await res.json();
            if (!items.length) { core.info('No new feedback.'); return; }
            // issues already opened for a message (a lost «done» must not give a second issue)
            const since = new Date(Date.now() - 2 * 86400000).toISOString();
            const recent = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, labels: 'via form', state: 'all', since, per_page: 100 });
            const seen = new Set(recent.map(i => ((i.body || '').match(/feedback-id: ([0-9a-f]+)/) || [])[1]).filter(Boolean));
            const block = s => {  // plain text: a code block longer than any run of backticks inside
              const runs = String(s).match(/`+/g) || [];
              const fence = '`'.repeat(Math.max(3, 1 + Math.max(0, ...runs.map(r => r.length))));
              return `${fence}text\n${s}\n${fence}`;
            };
            for (const it of items) {
              if (!/^[0-9a-f]{8,32}$/.test(it.id || '')) continue;
              if (!seen.has(it.id)) {
                const title = ('[Feedback] ' + [it.where || 'Results site', it.inv && `Inv. ${it.inv}`].filter(Boolean).join(' · ')).slice(0, 120);
                const when = new Date(it.t).toISOString().slice(0, 16).replace('T', ' ');
                const body = [`**What is it about?** ${it.kind}`, '',
                  '**What did you see, and what did you expect?**', '', block(it.details), '',
                  '**Where (filled in by the page)**', '', block(it.context || '(nothing)'), '',
                  `_Sent without a GitHub account through the feedback form of the results site (${when} UTC)._`,
                  `<!-- feedback-id: ${it.id} -->`].join('\n');
                const issue = await github.rest.issues.create({ ...context.repo, title, body, labels: ['feedback', 'via form'] });
                core.info(`Opened #${issue.data.number} for message ${it.id}`);
              }
              await fetch(`${relay}?done=${it.id}`);
            }
